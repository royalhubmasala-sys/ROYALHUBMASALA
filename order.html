<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Hub Masala - অর্ডার করুন</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .order-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #d32f2f;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #d32f2f;
            outline: none;
            box-shadow: 0 0 5px rgba(211, 47, 47, 0.2);
        }
        .submit-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #218838;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="order-container">
    <h2>📦 ROYAL HUB MASALA অর্ডার ফর্ম</h2>
    
    <form id="whatsappOrderForm">
        <!-- মসলা সিলেক্ট করার ড্রপডাউন -->
        <div class="form-group">
            <label for="productName">মসলার নাম বেছে নিন:</label>
            <select id="productName" required>
                <option value="" disabled selected>--- মসলা সিলেক্ট করুন ---</option>
                <option value="হলুদ গুঁড়ো (Turmeric Powder)">হলুদ গুঁড়ো (Turmeric Powder)</option>
                <option value="লঙ্কা গুঁড়ো (Chilli Powder)">লঙ্কা গুঁড়ো (Chilli Powder)</option>
                <option value="জিরে গুঁড়ো (Cumin Powder)">জিরে গুঁড়ো (Cumin Powder)</option>
                <option value="ধনে গুঁড়ো (Coriander Powder)">ধনে গুঁড়ো (Coriander Powder)</option>
                <option value="গরম মসলা (Garam Masala)">গরম মসলা (Garam Masala)</option>
            </select>
        </div>

        <!-- সাইজ সিলেক্ট করার ড্রপডাউন -->
        <div class="form-group">
            <label for="packetSize">প্যাকেটের সাইজ:</label>
            <select id="packetSize" required>
                <option value="15g">১৫ গ্রাম</option>
                <option value="50g">৫০ গ্রাম</option>
                <option value="100g">১০০ গ্রাম</option>
                <option value="250g">২৫০ গ্রাম</option>
                <option value="500g">৫০০ গ্রাম</option>
            </select>
        </div>

        <!-- কাস্টমারের নাম -->
        <div class="form-group">
            <label for="custName">আপনার নাম:</label>
            <input type="text" id="custName" placeholder="আপনার পুরো নাম লিখুন" required>
        </div>

        <!-- কাস্টমারের মোবাইল নম্বর -->
        <div class="form-group">
            <label for="custPhone">মোবাইল নম্বর:</label>
            <input type="tel" id="custPhone" placeholder="১০ সংখ্যার মোবাইল নম্বর" required>
        </div>

        <!-- কাস্টমারের সম্পূর্ণ ঠিকানা -->
        <div class="form-group">
            <label for="custAddress">সম্পূর্ণ ঠিকানা:</label>
            <textarea id="custAddress" placeholder="গ্রাম/রাস্তা, পোস্ট অফিস, জেলা, পিন কোড" required></textarea>
        </div>

        <!-- সাবমিট বাটন -->
        <button type="submit" class="submit-btn">🟢 WhatsApp-এ অর্ডার পাঠান</button>
    </form>
    
    <a href="index.html" class="back-link">← হোম পেজে ফিরে যান</a>
</div>

<script>
document.getElementById('whatsappOrderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // ফর্ম থেকে ডেটা নেওয়া হচ্ছে
    let pName = document.getElementById('productName').value;
    let pSize = document.getElementById('packetSize').value;
    let quantity=document.getElementbyId('quantity).value;
    let cName = document.getElementById('custName').value;
    let cPhone = document.getElementById('custPhone').value;
    let cAddress = document.getElementById('custAddress').value;
    
    // ⚠️ আপনার আসল WhatsApp নম্বরটি নিচের লাইনে দিন (যেমন: 919876543210)
    let whatsappNumber = "919046627185"; 
    
    // মেসেজের ফরম্যাট তৈরি করা হচ্ছে
    let message = *Royal Hub Masala - নতুন অর্ডার*\n\n +
                  📦 *প্রডাক্ট:* ${pName}\n +
                  ⚖️ *সাইজ:* ${pSize}\n +
                      '*${quantity}\n'+
                  👤 *নাম:* ${cName}\n +
                  📞 *ফোন:* ${cPhone}\n +
                  📍 *ঠিকানা:* ${cAddress};
    
    let encodemessage=encodeURIcomponent(message);
    let whatsappURL='https://whatsapp.com'+whatsappNumber+'&text='+encodedMessage;
    window.location.href=whatsappURL;
});
</script>

</body>
</html>
